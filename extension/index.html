<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Accelerated Execution</title>
  <style>
    body { margin: 0; padding: 16px; font: 13px system-ui, sans-serif; background: #232323; color: #eee; }
    h1 { font-size: 16px; margin: 0 0 14px; }
    .card { background: #2d2d2d; border: 1px solid #404040; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    button, select { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 8px; }
    button:disabled { opacity: .55; }
    .muted { color: #aaa; font-size: 12px; }
    #status { white-space: pre-wrap; }
    #results:empty { display: none; }
    .shot { margin-top: 12px; padding-top: 10px; border-top: 1px solid #454545; }
    .shot-header { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .shot-header span, .candidate-label { color: #aaa; font-size: 11px; }
    .candidates { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    button.candidate { min-width: 0; padding: 4px; background: #242424; color: #eee; border: 1px solid #4a4a4a; border-radius: 5px; }
    button.candidate.selected { border-color: #78a9ff; box-shadow: 0 0 0 1px #78a9ff inset; }
    .candidate-preview { display: block; position: relative; overflow: hidden; background: #181818; border-radius: 3px; }
    .candidate-preview.targetable { cursor: crosshair; }
    .candidate img { display: block; width: 100%; height: auto; }
    .candidate-label { display: block; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
    .target-overlay { position: absolute; z-index: 2; box-sizing: border-box; pointer-events: none; border: 2px solid #ffcc4d; background: rgba(255, 204, 77, .14); }
    .target-overlay.point { width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #ffcc4d; box-shadow: 0 0 0 2px rgba(0, 0, 0, .6); }
    .target-overlay.draft { border-style: dashed; }
    .target-controls { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 7px; color: #bbb; font-size: 11px; }
    .target-controls span { flex: 1; }
    button.target-clear { width: auto; flex: none; margin: 0; padding: 4px 7px; }
    .route-status { margin-top: 6px; color: #8fb8ff; font-size: 11px; }
  </style>
</head>
<body>
  <h1>Accelerated Execution</h1>
  <div class="card">
    <strong>Execution mode</strong>
    <select id="mode">
      <option value="efficient">Efficient — local first</option>
      <option value="native">AE native only</option>
      <option value="maximum">Maximum assistance</option>
    </select>
    <select id="task" aria-label="Task type">
      <option value="point-track">Point track</option>
      <option value="planar-track">Planar track</option>
      <option value="camera-track">Camera track</option>
      <option value="roto">Rotoscope</option>
      <option value="static-mask">Static mask</option>
    </select>
  </div>
  <div class="card">
    <strong>Active composition</strong>
    <div id="comp" class="muted">Not checked.</div>
    <button id="inspect">Inspect AE</button>
  </div>
  <div class="card">
    <strong>MVP</strong>
    <button id="analyze">Analyze selected footage</button>
    <button id="cancel" disabled>Cancel analysis</button>
    <button id="apply" disabled>Apply anchor markers in AE</button>
    <button id="export" disabled>Export scene plan</button>
    <div id="status" class="muted">Ready.</div>
    <div id="results"></div>
  </div>
  <script src="./js/CSInterface.js"></script>
  <script src="./js/sidecar.js"></script>
  <script src="./js/task-router.js"></script>
  <script src="./js/scene-plan.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
